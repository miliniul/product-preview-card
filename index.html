<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles/style.css">

  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main>
    <img src="images/image-product-mobile.jpg" alt="">
    <div class="title">
      <p class="product-type">Perfume</p>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>
    </div>

    <div class="price">
      <p class="price-after">$149.99</p>
      <p class="price-before">$169.99</p>
    </div>

    <button>Add to Cart</button>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/miliniul">miliniul</a>.
  </footer>
</body>

</html>
